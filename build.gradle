plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.spotbugs' version '6.5.11'
    id 'pmd'
    id 'jacoco'
}

group = 'dev.sobue'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

pmd {
    toolVersion = '7.26.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.session:spring-session-core'

    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    // Snyk SCM scans currently follow the starter's Spring Boot 4.1.0 metadata without applying this build's 4.1.1 BOM.
    // Remove this exclusion together with the workaround once MyBatis aligns its metadata or Snyk resolves the BOM correctly.
    implementation('org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0') {
        exclude group: 'org.springframework.boot'
    }

    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    reports {
        junitXml.required = true
        html.required = true
    }
}

// https://docs.gradle.org/current/userguide/jacoco_plugin.html
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('pmdMain') {
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/pmd/main.xml')
        html.required = true
        html.outputLocation = layout.buildDirectory.file('reports/pmd/main.html')
    }
}

tasks.named('pmdTest') {
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/pmd/test.xml')
        html.required = true
        html.outputLocation = layout.buildDirectory.file('reports/pmd/test.html')
    }
}

tasks.named('spotbugsMain') {
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/spotbugs/main.xml')
        html.required = true
        html.outputLocation = layout.buildDirectory.file('reports/spotbugs/main.html')
    }
}

tasks.named('spotbugsTest') {
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/spotbugs/test.xml')
        html.required = true
        html.outputLocation = layout.buildDirectory.file('reports/spotbugs/test.html')
    }
}

tasks.register('prepareSonarLibraries', Sync) {
    from(configurations.compileClasspath) {
        into 'main'
    }
    from(configurations.testCompileClasspath) {
        into 'test'
    }
    into layout.buildDirectory.dir('sonar-libraries')
}
