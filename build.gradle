import org.springframework.boot.gradle.plugin.SpringBootPlugin
import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'java'
    id 'pmd'
    id 'jacoco'
    id 'net.ltgt.errorprone' version '5.1.0'
    id 'org.springframework.boot' version '4.1.1'
    id 'com.github.spotbugs' version '6.5.11'
    id 'org.sonarqube' version '7.3.1.8318'
}

group = 'dev.sobue'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

pmd {
    toolVersion = '7.26.0'
}

dependencies {
    implementation enforcedPlatform(SpringBootPlugin.BOM_COORDINATES)
    compileOnly enforcedPlatform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor enforcedPlatform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation enforcedPlatform(SpringBootPlugin.BOM_COORDINATES)
    testCompileOnly enforcedPlatform(SpringBootPlugin.BOM_COORDINATES)
    testAnnotationProcessor enforcedPlatform(SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.session:spring-session-core'

    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    // Snyk SCM scans currently follow the starter's Spring Boot 4.1.0 metadata without applying this build's 4.1.1 BOM.
    // Remove this exclusion together with the workaround once MyBatis aligns its metadata or Snyk resolves the BOM correctly.
    implementation('org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0') {
        exclude group: 'org.springframework.boot'
    }

    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly 'org.projectlombok:lombok'
    compileOnly 'org.jspecify:jspecify'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.13.8'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    jvmArgs '-Xshare:off'
    reports {
        junitXml.required = true
        html.required = true
    }
}

tasks.withType(JavaCompile).configureEach {
    if (name.toLowerCase(Locale.ROOT).contains('aot')) {
        options.errorprone.enabled = false
        return
    }
    options.errorprone {
        check('NullAway', CheckSeverity.ERROR)
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:JSpecifyMode', 'true')
        if (name.toLowerCase(Locale.ROOT).contains('test')) {
            disable('NullAway')
        }
    }
}

// https://docs.gradle.org/current/userguide/jacoco_plugin.html
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.spotbugsMain {
    reports.create("xml") {
        required = true
    }
}

tasks.named('bootJar') {
    archiveFileName = "${project.name}.jar"
}

sonar {
    properties {
        property 'sonar.projectKey', 'ssobue_consultation-record'
        property 'sonar.organization', 'ssobue'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.sources', 'src/main/java,src/main/resources,.github'
        property 'sonar.tests', 'src/test/java'
        property 'sonar.coverage.jacoco.xmlReportPaths', layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.path
    }
}
